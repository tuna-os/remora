version: 2
project_name: remora

builds:
  - main: ./cmd/remora
    binary: remora
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w"]

archives:
  - formats: [binary]
    name_template: "remora-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

release:
  # release-please creates the GitHub release with the CHANGELOG.md entry as
  # its body; goreleaser only attaches the binaries and checksums.txt. Note
  # that `mode` governs the release *notes*, not the artifacts, so anything
  # but keep-existing would clobber or duplicate the curated changelog.
  mode: keep-existing
