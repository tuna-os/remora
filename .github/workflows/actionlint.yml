name: Workflow lint

on:
  pull_request:
    paths: [".github/workflows/**"]
  push:
    branches: [main, dev, prod]
    paths: [".github/workflows/**"]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate GitHub Actions workflows
        # Existing repositories own their shellcheck policy separately. This
        # keeps actionlint focused on workflow syntax and expressions.
        #
        # Pinned to a digest rather than :latest so a lint result is
        # reproducible from the commit alone and an upstream image
        # replacement cannot change CI behavior without a reviewed change
        # here. To upgrade: resolve the new tag's index digest with
        #   docker buildx imagetools inspect rhysd/actionlint:<version>
        # and update both the digest and the version comment below.
        #
        # actionlint v1.7.12 (:latest resolved to this digest on 2026-09-02)
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -ignore shellcheck
