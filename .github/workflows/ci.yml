name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run the local-equivalent checks
        run: |
          go build ./...
          just check
      - name: Smoke generated project without a bootc host
        run: |
          go build -o remora ./cmd/remora
          D=$(mktemp -d)
          printf 'base: quay.io/fedora/fedora-bootc:latest\npackage_manager: dnf\npackages: [htop]\n' > "$D/remora.yaml"
          ./remora generate --dir "$D"
          grep -q 'FROM quay.io/fedora/fedora-bootc:latest' "$D/Containerfile"
          ./remora install --dir "$D" --no-build vim
          ./remora list --dir "$D" | grep -qx vim

  required-checks:
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required validation passed
        run: test "${{ needs.test.result }}" = success
