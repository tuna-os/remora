name: Release Please

# Keeps an open "chore: release vX.Y.Z" pull request describing the next
# release. Merging that PR is what cuts a release: release-please creates the
# tag and the GitHub release from CHANGELOG.md, and the goreleaser job below
# attaches the binaries and checksums.txt to it.
#
# goreleaser runs here rather than being left to release.yml because a tag
# created with GITHUB_TOKEN does not trigger further workflow runs. release.yml
# still exists for tags pushed by hand, which is the escape hatch when a
# release has to happen outside this flow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
      # Required to dispatch the CI workflow onto the release branch below.
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The release pull request is opened with GITHUB_TOKEN, and events
      # triggered by that token do not start workflow runs -- so the release
      # PR arrives with no checks on it at all. workflow_dispatch is the one
      # documented exception: it always creates a run. Dispatching CI on the
      # release branch attaches the checks to that branch's head, which is the
      # PR's head commit, so they show up on the pull request.
      #
      # Without this the only alternative is a PAT or GitHub App token, which
      # needs a secret this repository does not have.
      - name: Run CI against the release pull request
        # Never block a release on this: the release itself is the important
        # half, and a failed dispatch just leaves the PR as bare as it was.
        continue-on-error: true
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # release-please derives the branch from its branch prefix and the
          # target branch; this workflow only ever runs on the target branch.
          BRANCH: release-please--branches--${{ github.ref_name }}
        run: |
          echo "Dispatching CI on $BRANCH"
          gh workflow run ci.yml --ref "$BRANCH" --repo "$GITHUB_REPOSITORY"

  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
